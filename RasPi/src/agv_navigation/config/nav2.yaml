# Nav2 cho AGV kho hang. Goc: nav2_bringup/params/nav2_params.yaml cua Nav2 Jazzy (1.3.x),
# giong cach lam cua linorobot2. Chi doi cac dong co ghi chu "AGV:".
amcl:
  ros__parameters:
    # AGV: nhieu chuyen dong theo do thuc te. alpha la phuong sai tuong doi (std = sqrt(alpha) x chuyen dong):
    # 0.2 = gia dinh odom sai ~45 %, nhung odom EKF do duoc chi sai 2-3 % quang duong, goc tu gyro.
    # alpha4 = 0.2 lam dam hat phinh ra moi lan xe quay tai cho (vung chet dong co -> quay rat nhieu)
    # -> dam hat tan toi 1.8 m o khu phia dong, AMCL lech 0.3-0.8 m. 0.05 (~22 %) van du xa.
    alpha1: 0.05
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.05
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 10.0         # AGV: YDLidar X4
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.95                   # AGV: mac dinh cua AMCL ROS 1 (AMCL.cfg); Nav2 de 0.5/0.5 lam diem
    z_max: 0.05
    z_rand: 0.05                  #   cua hat dung chi gap ~2.3 lan hat trung binh, 0.95/0.05 -> ~2.9 lan
    z_short: 0.05
    scan_topic: scan
    # AGV: xe xuat phat dung cho bat dau lap ban do (goc frame map), khoi phai bam "2D Pose Estimate"
    set_initial_pose: true
    # AGV: xe xuat phat tai tram sac (stations.yaml tram_sac, sim.launch.py x/y/yaw:=auto). Dat xe cho
    # khac thi bam "2D Pose Estimate" tren RViz.
    initial_pose:
      x: -0.45
      y: 0.0
      z: 0.0
      yaw: 3.14159

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.

    # plugin_lib_names is used to add custom BT plugins to the executor (vector of strings).
    # Built-in plugins are added automatically
    # plugin_lib_names: []

    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    # AGV: bo dieu khien lay nguyen tu linorobot2 (jazzy): quay tai cho ve huong duong
    # (RotationShim) roi bam duong bang Regulated Pure Pursuit voi toc do gan nhu deu.
    # Hop voi xe co vung chet dong co: khong can chay cham, quay tai cho thi xe lam duoc.
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      angular_dist_threshold: 0.785
      angular_disengage_threshold: 0.3925
      forward_sampling_distance: 0.5
      rotate_to_heading_angular_vel: 1.8
      max_angular_accel: 3.2
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: false
      rotate_to_heading_once: true
      use_path_orientations: false
    # FollowPath:
    #   plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.4
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.75
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.6
      use_rotate_to_heading: true
      allow_reversing: false
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 3.2
      max_robot_pose_search_dist: 10.0
      stateful: true

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # AGV: hinh chu nhat cua xe (mica 0.30 m + banh ra ngoai, rong 0.37 m) + 1 cm. Khi cho ke
      # mini, payload_manager.py gui footprint cua ke (0.88 x 0.78 m) len topic footprint.
      footprint: "[[0.16, 0.19], [0.16, -0.19], [-0.16, -0.19], [-0.16, 0.19]]"
      plugins: ["voxel_layer", "inflation_layer"]
      # AGV: KHONG dung vung cam o local costmap. Vung cam (o ke mini) chi o global costmap de
      # khong lap duong xuyen gam ke; neu de o day thi bo dieu khien docking thay mep vung cam la
      # vat can va khong cho chui vao o ("Collision detected", REPORT.md). Chan ke van nam trong
      # local costmap nho lidar.
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.70
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      # AGV: hinh chu nhat cua xe (mica 0.30 m + banh ra ngoai, rong 0.37 m) + 1 cm. Khi cho ke
      # mini, payload_manager.py gui footprint cua ke (0.88 x 0.78 m) len topic footprint.
      footprint: "[[0.16, 0.19], [0.16, -0.19], [-0.16, -0.19], [-0.16, 0.19]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      # AGV: vung cam (cac o ke mini: khong cho lap duong xuyen gam ke) tu maps/keepout_mask,
      # nhu nav2_costmap_filters_demo. Chui vao o do docking_server lo (bo qua costmap gan dock).
      filters: ["keepout_filter"]
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: True
        filter_info_topic: "/costmap_filter_info"
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.7
      always_send_full_costmap: True

# The yaml_filename does not need to be specified since it going to be set by defaults in launch.
# If you'd rather set it in the yaml, remove the default "map" value in the tb3_simulation_launch.py
# file & provide full path to map below. If CLI map configuration or launch default is provided, that will be used.
# map_server:
#   ros__parameters:
#     yaml_filename: ""

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

route_server:
  ros__parameters:
    # The graph_filepath does not need to be specified since it going to be set by defaults in launch.
    # If you'd rather set it in the yaml, remove the default "graph" value in the launch file(s).
    # file & provide full path to map below. If graph config or launch default is provided, it is used
    # graph_filepath: $(find-pkg-share nav2_route)/graphs/aws_graph.geojson
    boundary_radius_to_achieve_node: 1.0
    radius_to_achieve_node: 2.0
    smooth_corners: true
    operations: ["AdjustSpeedLimit", "ReroutingService", "CollisionMonitor"]
    ReroutingService:
      plugin: "nav2_route::ReroutingService"
    AdjustSpeedLimit:
      plugin: "nav2_route::AdjustSpeedLimit"
    CollisionMonitor:
      plugin: "nav2_route::CollisionMonitor"
      max_collision_dist: 3.0
    edge_cost_functions: ["DistanceScorer", "CostmapScorer"]
    DistanceScorer:
      plugin: "nav2_route::DistanceScorer"
    CostmapScorer:
      plugin: "nav2_route::CostmapScorer"

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: False
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.0, 2.0]
    min_velocity: [-0.5, 0.0, -2.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    # Polygons represent zone around the robot for "stop", "slowdown" and "limit" action types,
    # and robot footprint for "approach" action type.
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
      # AGV: lidar giua 2 tang quet o ~0.12 m (mac dinh Nav2 0.15 se bo het diem cua xe nay)
      min_height: 0.05
      max_height: 2.0
      enabled: True

docking_server:
  ros__parameters:
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5

    # Types of docks
    # AGV: ke mini (chui gam, khong sac). Xe dung o staging trong loi di, truoc o 1.0 m, roi tien
    # thang vao. 2 loai:
    #   shelf_dock: LAY ke - chui gam theo ke THAT do shelf_detector.py tim tu 4 chan ke
    #               (/detected_dock_pose), khong theo vi tri o (ke tra ve lech vai cm moi lan, AMCL lech ~5 cm)
    #   slot_dock : TRA ke vao o trong (khong co chan ke nao de nhan dien) - theo vi tri o tren ban do
    dock_plugins: ['simple_charging_dock', 'shelf_dock', 'slot_dock']
    shelf_dock:
      plugin: 'opennav_docking::SimpleNonChargingDock'
      docking_threshold: 0.03
      staging_x_offset: -1.0               # = -shelf.staging_offset (agv_mission/config/shelves.yaml)
      use_external_detection_pose: true
      external_detection_timeout: 1.0      # lidar 7 Hz: 1 s = ~7 scan
      # shelf_detector phat dung tam ke, huong ke theo huong xe -> khong can doi (mac dinh -0.2 m va
      # roll/pitch +-1.57 la cho camera doc AprilTag)
      external_detection_translation_x: 0.0
      external_detection_translation_y: 0.0
      external_detection_rotation_yaw: 0.0
      external_detection_rotation_pitch: 0.0
      external_detection_rotation_roll: 0.0
      filter_coef: 0.1
      use_stall_detection: false
    slot_dock:
      plugin: 'opennav_docking::SimpleNonChargingDock'
      docking_threshold: 0.03
      staging_x_offset: -1.0
      use_external_detection_pose: false
      use_stall_detection: false
    # AGV: tram sac (dock charger_tram_sac). Theo vi tri tren ban do: KHONG bat external detection
    # (topic detected_dock_pose la cua shelf_detector -> xe se chui vao ke thay vi vao tram sac).
    # "Dang sac" = dong /battery_state > charging_threshold (battery_sim / INA226 tren xe that).
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: false
      use_battery_status: true
      charging_threshold: 0.5
      use_stall_detection: false

    # Dock instances: moi o ke la mot dock + tram sac, SINH TU DONG tu agv_mission/config/shelves.yaml
    # va stations.yaml
    # boi agv_gazebo/scripts/make_warehouse.py (khong sua tay giua 2 dong danh dau)
    # BEGIN DOCKS (make_warehouse.py)
    docks: ['slot_N1', 'slot_N2', 'slot_N3', 'slot_N4', 'slot_N5', 'slot_S1', 'slot_S2', 'slot_S3', 'slot_S4', 'slot_S5', 'charger_tram_sac']
    charger_tram_sac:
      type: 'simple_charging_dock'
      frame: map
      pose: [-0.45, 0.0, 3.14159]
    slot_N1:
      type: 'shelf_dock'
      frame: map
      pose: [3.0, 1.6, 1.5708]
    slot_N2:
      type: 'shelf_dock'
      frame: map
      pose: [4.1, 1.6, 1.5708]
    slot_N3:
      type: 'shelf_dock'
      frame: map
      pose: [5.2, 1.6, 1.5708]
    slot_N4:
      type: 'shelf_dock'
      frame: map
      pose: [6.3, 1.6, 1.5708]
    slot_N5:
      type: 'shelf_dock'
      frame: map
      pose: [7.4, 1.6, 1.5708]
    slot_S1:
      type: 'shelf_dock'
      frame: map
      pose: [3.0, -1.6, -1.5708]
    slot_S2:
      type: 'shelf_dock'
      frame: map
      pose: [4.1, -1.6, -1.5708]
    slot_S3:
      type: 'shelf_dock'
      frame: map
      pose: [5.2, -1.6, -1.5708]
    slot_S4:
      type: 'shelf_dock'
      frame: map
      pose: [6.3, -1.6, -1.5708]
    slot_S5:
      type: 'shelf_dock'
      frame: map
      pose: [7.4, -1.6, -1.5708]
    # END DOCKS

    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
      use_collision_detection: true
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 5.0
      # AGV: ten dung la simulation_time_step (file mau ghi simulation_step, bi bo qua)
      simulation_time_step: 0.1
      # AGV: bo qua va cham trong 0.45 m quanh dich (= tam dock lui them 0.25 m). 0.3 (mac dinh) thi
      # khoi tiep diem tram sac (vat can lidar thay) bi tinh la va cham khi xe con cach dock 3-7 cm
      # (REPORT.md 4.12). Voi ke: chi bo qua ~20 cm cuoi, luc xe da can theo chan ke (+-1 cm).
      dock_collision_threshold: 0.45

loopback_simulator:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    map_frame_id: "map"
    scan_frame_id: "base_scan"  # tb4_loopback_simulator.launch.py remaps to 'rplidar_link'
    update_duration: 0.02
    scan_range_min: 0.05
    scan_range_max: 30.0
    scan_angle_min: -3.1415
    scan_angle_max: 3.1415
    scan_angle_increment: 0.02617
    scan_use_inf: true

# AGV: mat na vung cam, lay tu nav2_costmap_filters_demo/params/keepout_params.yaml
costmap_filter_info_server:
  ros__parameters:
    type: 0                       # 0 = keepout / preferred lanes
    filter_info_topic: "/costmap_filter_info"
    mask_topic: "/keepout_filter_mask"
    base: 0.0
    multiplier: 1.0

filter_mask_server:
  ros__parameters:
    frame_id: "map"
    topic_name: "/keepout_filter_mask"
    yaml_filename: ""             # navigation.launch.py dien maps/keepout_mask.yaml
