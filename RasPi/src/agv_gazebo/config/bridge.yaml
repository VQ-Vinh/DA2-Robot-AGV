# Cau noi topic Gazebo <-> ROS 2 (ros_gz_bridge). Ten topic giong nhau o ca hai phia.
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# Lenh van toc di qua motor_model truoc khi toi DiffDrive, giong xe that di qua firmware:
#   teleop / Nav2 -> /cmd_vel -> motor_model -> /cmd_vel_limited -> DiffDrive
# Bang Teleop trong Gazebo gui len gz /cmd_vel, chuyen sang ROS de cung di qua motor_model.
- ros_topic_name: "/cmd_vel"
  gz_topic_name: "/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: GZ_TO_ROS

- ros_topic_name: "/cmd_vel_limited"
  gz_topic_name: "/model/agv/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

# Vi tri that, chi de danh gia sai so odom / EKF
- ros_topic_name: "/ground_truth"
  gz_topic_name: "/ground_truth"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# Odom banh xe tho -> wheel_odom (them covariance) -> /wheel/odom -> EKF -> /odom.
# TF odom -> base_footprint do EKF phat (sim.launch.py), khong bridge o day.
- ros_topic_name: "/sim/wheel_odom"
  gz_topic_name: "/model/agv/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "/joint_states"
  gz_topic_name: "/joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

# Scan tho (co tru oc xe, chan ke dang cho) -> payload_manager loc -> /scan cho SLAM / AMCL / Nav2
- ros_topic_name: "/scan_raw"
  gz_topic_name: "/scan_raw"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

# Co cau nang: lenh vi tri (m, 0 = ha) tu lift_sim, cam bien tiep xuc mat nang
- ros_topic_name: "/lift/cmd_pos"
  gz_topic_name: "/lift/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/lift/contact"
  gz_topic_name: "/lift/contact"
  ros_type_name: "ros_gz_interfaces/msg/Contacts"
  gz_type_name: "gz.msgs.Contacts"
  direction: GZ_TO_ROS

- ros_topic_name: "/imu"
  gz_topic_name: "/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS
