# Nhiem vu dinh san: chuoi buoc, moi buoc = toi mot vi tri (stations.yaml) roi lam viec.
#   station : ten vi tri
#   task    : pick (lay hang) | drop (tra hang) | charge (sac) | pass (chi di qua)
#   wait_s  : thoi gian dung tai cho, giay
#
# Van chuyen ke (chui gam, nang, cho toi tram) khong nam o day: xem shelves.yaml va lenh
# cua don hang (giai doan sau). File nay chi con cac lo trinh di chuyen don gian.
#
# Chay tu dong khi khoi dong:  ros2 launch agv_gazebo sim.launch.py nav:=true mission:=tuan_tra
# Hoac go lenh:                ros2 run agv_mission agv_cmd.py run tuan_tra
missions:
  tuan_tra:
    description: "Di doc loi giua khu luu ke, qua tram lay hang roi ve tram sac"
    steps:
      - {station: loi_tay, task: pass, wait_s: 1.0}
      - {station: loi_dong, task: pass, wait_s: 1.0}
      - {station: tram_lay_hang, task: pass, wait_s: 1.0}
      - {station: khu_nhap_hang, task: pass, wait_s: 1.0}
      - {station: tram_sac, task: charge, wait_s: 0.0}
