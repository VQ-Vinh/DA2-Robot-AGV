# Cac vi tri co ten trong kho (khong phai o ke - o ke o shelves.yaml), frame "map"
# (goc = cho xe xuat phat luc lap ban do, tuc world x = -4.5, y = 0: map = world + (4.5, 0)).
#
#   x, y : m        yaw : rad (huong xe khi toi noi, 0 = huong +x cua ban do)
#   kind : charge (tram sac) | pick (tram lay hang: nguoi lay hang tu ke xe cho toi)
#          | inbound (khu nhap hang, bo sung hang len ke) | waypoint (diem tren loi di)
stations:
  # Tram sac sau cho xe xuat phat 0.45 m, xe tien ve phia tay de cham tiep diem. Dat ngay tai cho
  # xuat phat thi khoi tiep diem chan dau xe luc khoi dong (REPORT.md 4.12).
  tram_sac:
    x: -0.45
    y: 0.0
    yaw: 3.14159
    kind: charge
    label: "Tram sac"
  tram_lay_hang:
    x: 0.1
    y: -3.0
    yaw: 3.14159
    kind: pick
    label: "Tram lay hang"
  khu_nhap_hang:
    x: 0.1
    y: 3.0
    yaw: 3.14159
    kind: inbound
    label: "Khu nhap hang"
  loi_tay: {x: 1.8, y: 0.0, yaw: 0.0, kind: waypoint, label: "Loi giua (tay)"}
  loi_dong: {x: 8.7, y: 0.0, yaw: 3.14159, kind: waypoint, label: "Loi giua (dong)"}
