# EKF cho AGV skid-steer: gop odom banh xe (/wheel/odom) va gyro IMU (/imu).
# Dung chung cho mo phong va xe that: ca hai deu phai gui /wheel/odom (co covariance) va /imu.
#
# Vi sao chi lay van toc, khong lay vi tri / goc tu cam bien:
#   - Odom banh xe: vi tri tich phan da troi, chi lay vx, vy (= 0, xe khong di ngang)
#     va wz. wz cua banh xe rat kem do skid-steer truot khi quay, covariance lon (0.1)
#     nen EKF gan nhu chi dung wz cua gyro.
#   - IMU: chi lay wz cua gyro. Khong lay goc tuyet doi: BNO055 tinh yaw bang tu ke,
#     trong kho nhieu sat thep nen khong tin duoc. Gia toc thang qua nhieu, bo qua.
#
# Ket qua: /odom (nav_msgs/Odometry) va TF odom -> base_footprint.
ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # Thu tu 15 o: x y z | roll pitch yaw | vx vy vz | vroll vpitch vyaw | ax ay az
    odom0: /wheel/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 10

    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 20
    imu0_remove_gravitational_acceleration: true
